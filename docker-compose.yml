version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://wapadrant:wapadrant@localhost:5432/wapadrant?schema=public
    container_name: wapadrant-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://wapadrant:wapadrant@localhost:5432/wapadrant?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3100}
      API_BASE_URL: http://localhost:3100
      SMTP_HOST: mail.gkwapadrant.co.za
      SMTP_PORT: "465"
      SMTP_USER: besprekings@gkwapadrant.co.za
      SMTP_PASSWORD: RogerAlice@72
      SMTP_FROM: "Wapadrant Gemeente <besprekings@gkwapadrant.co.za>"
      OFFICE_EMAIL: kantoor@gkwapadrant.co.za
      COPY_EMAIL: pieter@arbstorage.co.za, uitreik@gkwapadrant.co.za
    ports:
      - "3100:3100"
    volumes:
      - wapadrant-pg-data:/var/lib/postgresql/data

volumes:
  wapadrant-pg-data:
